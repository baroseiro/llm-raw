[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-raw"
version = "0.2.0"
description = "A small, transparent, OpenAI-compatible LLM harness with tools, MCP, sessions, and a terminal UI."
authors = [{ name = "llm-raw contributors" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llm", "openai", "harness", "mcp", "terminal", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.scripts]
llm-raw = "llm_raw:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["llm_raw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
